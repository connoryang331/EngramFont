<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EngramFont</title>
    <link rel="icon" type="image/svg+xml" href="/images/fontra-icon.svg" />
    <link href="/css/shared.css" rel="stylesheet" />
    <link href="/css/core.css" rel="stylesheet" />
    <link href="./assets/landing.css" rel="stylesheet" />
  </head>
  <body class="landing-body">
    <div id="global-loader-spinner"></div>

    <div class="landing-content">
      <div class="landing-item" id="engramfont-icon-header">
        <img src="/images/fontra-icon.svg" width="100" height="100" />
      </div>

      <div class="landing-item" id="project-list" tabindex="3"></div>

      <div class="landing-item" id="engramfont-import-area">
        <input
          type="file"
          id="engramfont-import-file-input"
          accept=".ttf,.otf,.woff,.woff2"
          hidden
        />
        <button id="engramfont-import-button" tabindex="4">Import font…</button>
        <div id="engramfont-import-error" class="hidden"></div>
      </div>
    </div>
  </body>
  <script type="module" src="@fontra/projectmanager-filesystem/start.js"></script>
</html>
